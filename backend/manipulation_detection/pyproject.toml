[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-detection"
version = "1.0.0"
description = "Manipulation tactic detection ML pipeline for ManTacAi"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "spacy>=3.5.0",
]

[project.optional-dependencies]
training = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "evaluate>=0.4.0",
    "datasets>=2.12.0",
    "accelerate>=0.20.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
